# Excalidraw hub + its canvas. Start: `docker compose up -d --build` here. Settings: .env or the shell (see .env.example).
# Hub http://localhost:${HUB_PORT:-3080}, canvas http://localhost:${CANVAS_PORT:-3000}. The compose project name is the clone's folder name.
services:
  canvas:
    # Fork of yctimlin/mcp_excalidraw (git subtree in canvas/): stock canvas + code blocks (Mermaid, PlantUML, Salt).
    # In-memory scene: a restart empties it; drawings live in the folders attached in the hub.
    build:
      context: ./canvas
      dockerfile: Dockerfile.canvas
    ports:
      - "127.0.0.1:${CANVAS_PORT:-3000}:3000"   # the agent's Excalidraw MCP and the hub iframe use this port
    environment:
      # Code blocks: PlantUML/Salt render via the canvas server. Set PLANTUML_URL in .env to use an existing
      # renderer (e.g. https://kroki.io/plantuml) and the plantuml container is not started. Mermaid renders in the browser.
      PLANTUML_URL: "${PLANTUML_URL:-http://plantuml:8080}"
    volumes:
      # Same path as on the host: the MCP's file export (docker compose exec into this container) writes where the drawings are.
      - "${FOLDERS_ROOT:-${HOME}}:${FOLDERS_ROOT:-${HOME}}"
    depends_on:
      plantuml:
        condition: service_started
        required: false   # absent when PLANTUML_URL is set
    healthcheck:   # the image has no curl/wget; node is there
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
  plantuml:
    # Local renderer for PlantUML and Salt; diagram text never leaves the machine. No host port.
    # Runs only while PLANTUML_URL is unset: then its profile is "", which compose starts by default.
    profiles: ["${PLANTUML_URL:+external-renderer}"]
    image: plantuml/plantuml-server:jetty@sha256:3719f4a9b0b061f1aa42d14d130388f831954ca65685d521b6c5b72301e993e6   # pinned 2026-11-14 (built 2026-11-11)
    environment:
      PLANTUML_SECURITY_PROFILE: SANDBOX   # no file or URL includes; stdlib (C4, sprites) still works (probed 2026-11-14)
    restart: unless-stopped
  hub:
    build: .
    ports:
      - "127.0.0.1:${HUB_PORT:-3080}:${HUB_PORT:-3080}"   # host loopback only
    # Host user, so saved drawings are not root-owned (.env sets UID/GID; bash does not export them).
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HUB_HOST: 0.0.0.0
      HUB_PORT: "${HUB_PORT:-3080}"
      HUB_WAIT_FOR_MOUNT: "1"   # exit until FOLDERS_ROOT is mounted (Docker Desktop can start us before the WSL mount)
      CANVAS_URL: http://canvas:3000   # server -> canvas REST (compose network)
      CANVAS_PUBLIC_URL: "${CANVAS_PUBLIC_URL:-http://localhost:${CANVAS_PORT:-3000}}"   # browser -> canvas iframe
      HOME: /home/node
      FOLDERS_ROOT: "${FOLDERS_ROOT:-${HOME}}"   # only folders inside it can be attached (mounted below)
      HUB_STATE: /config/hub.json   # attached folders; ./config on the host, shared with scripts/native.sh
      BACKUPS_DIR: /backups
      HUB_AUTO_SYNC_BRANCHES: "${HUB_AUTO_SYNC_BRANCHES:-development,dev}"
    volumes:
      - "./config:/config"
      - "${BACKUPS_DIR:-./backups}:/backups"   # copies of overwritten drawings, for Revert
      # Same path inside as on the host, so a path typed in "+ Add folder" means the same in both runtimes.
      # Read-write: drawings in attached folders are saved there. Narrow it with FOLDERS_ROOT (e.g. ~/repos).
      - "${FOLDERS_ROOT:-${HOME}}:${FOLDERS_ROOT:-${HOME}}"
      # Your git identity and SSH key, so sync commits as you and can push (key must have no passphrase).
      - "${HOME}/.gitconfig:/home/node/.gitconfig:ro"
      - "${HOME}/.ssh:/home/node/.ssh:ro"
    depends_on:
      canvas:
        condition: service_healthy   # the hub reads the canvas at start
    restart: unless-stopped
