# Isolated test stack: own canvas, hub over a fixture copy, Playwright runner, all on the compose network.
# Published on 127.0.0.1:3100 / :3180 for debugging only. Never touches the real canvas (:3000) or the real drawings.
# One temp folder (HUB_TEST_DIR, made by scripts/e2e.sh) holds the throwaway repo, its bare origin, the backups, the state
# file and a second folder to attach. It is FOLDERS_ROOT and is mounted at the same path in the hub and the runner.
# Run via scripts/e2e.sh.
name: excalidraw-hub-test
services:
  canvas:
    build:
      context: ./canvas
      dockerfile: Dockerfile.canvas
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      PLANTUML_URL: http://plantuml:8080
    depends_on: [plantuml]
  plantuml:
    image: plantuml/plantuml-server:jetty@sha256:3719f4a9b0b061f1aa42d14d130388f831954ca65685d521b6c5b72301e993e6
    environment:
      PLANTUML_SECURITY_PROFILE: SANDBOX
  hub:
    build: .
    ports:
      - "127.0.0.1:3180:3180"
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HUB_HOST: 0.0.0.0
      HUB_PORT: "3180"
      HUB_ALLOWED_HOSTS: "hub:3180,127.0.0.1:3180,localhost:3180"
      CANVAS_URL: http://canvas:3000
      CANVAS_PUBLIC_URL: http://canvas:3000
      HOME: /tmp
      FOLDERS_ROOT: "${HUB_TEST_DIR:?set by scripts/e2e.sh}"
      HUB_STATE: "${HUB_TEST_DIR:?set by scripts/e2e.sh}/state/hub.json"
      BACKUPS_DIR: "${HUB_TEST_DIR:?set by scripts/e2e.sh}/backups"
      GIT_AUTHOR_NAME: e2e
      GIT_AUTHOR_EMAIL: e2e@example.invalid
      GIT_COMMITTER_NAME: e2e
      GIT_COMMITTER_EMAIL: e2e@example.invalid
    volumes:
      - "${HUB_TEST_DIR:?set by scripts/e2e.sh}:${HUB_TEST_DIR:?set by scripts/e2e.sh}"
    depends_on: [canvas]
  e2e:
    build:
      context: e2e
    profiles: [e2e]
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    environment:
      HUB_URL: http://hub:3180
      CANVAS_URL: http://canvas:3000
      DATA_DIR: "${HUB_TEST_DIR:?set by scripts/e2e.sh}/repo/docs/drawings"
      GIT_REPO_DIR: "${HUB_TEST_DIR:?set by scripts/e2e.sh}/repo"
      BACKUPS_DIR: "${HUB_TEST_DIR:?set by scripts/e2e.sh}/backups"
      REMOTE_DIR: "${HUB_TEST_DIR:?set by scripts/e2e.sh}/remote.git"
      EXTRA_DIR: "${HUB_TEST_DIR:?set by scripts/e2e.sh}/extra"
      STATE_FILE: "${HUB_TEST_DIR:?set by scripts/e2e.sh}/state/hub.json"
      GIT_AUTHOR_NAME: e2e
      GIT_AUTHOR_EMAIL: e2e@example.invalid
      GIT_COMMITTER_NAME: e2e
      GIT_COMMITTER_EMAIL: e2e@example.invalid
      HOME: /tmp
    volumes:
      # Read-write: the sync test pushes to the bare origin and writes a drawing into the checkout, as a user would.
      - "${HUB_TEST_DIR:?set by scripts/e2e.sh}:${HUB_TEST_DIR:?set by scripts/e2e.sh}"
      - "./test-results:/e2e/test-results"
    depends_on: [hub]
