# Isolated test stack: own canvas, hub over a fixture copy, Playwright runner, all on the compose network.
# Published on 127.0.0.1:3100 / :3180 for debugging only. Never touches parent repo's canvas (:3000) or docs/drawings.
# Run via scripts/e2e.sh.
name: excalidraw-hub-test
services:
  canvas:
    image: ghcr.io/yctimlin/mcp_excalidraw-canvas:2.1.2
    ports:
      - "127.0.0.1:3100:3000"
  hub:
    build: .
    ports:
      - "127.0.0.1:3180:3180"
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HUB_HOST: 0.0.0.0
      HUB_PORT: "3180"
      HUB_ALLOWED_HOSTS: "hub:3180,127.0.0.1:3180,localhost:3180"
      CANVAS_URL: http://canvas:3000
      CANVAS_PUBLIC_URL: http://canvas:3000
      HOME: /tmp
      REPO_DIR: /repo
      DRAWINGS_DIR: /repo/docs/drawings
      BACKUPS_DIR: /backups
      SYNC_BRANCH: dev
      GIT_AUTHOR_NAME: e2e
      GIT_AUTHOR_EMAIL: e2e@example.invalid
      GIT_COMMITTER_NAME: e2e
      GIT_COMMITTER_EMAIL: e2e@example.invalid
    volumes:
      # A throwaway repo (fixtures under docs/drawings) whose origin is the bare repo at /remote. Never the real one.
      - "${HUB_TEST_REPO:?set by scripts/e2e.sh}:/repo"
      - "${HUB_TEST_REMOTE:?set by scripts/e2e.sh}:/remote"
      - "${HUB_TEST_BACKUPS:?set by scripts/e2e.sh}:/backups"
    depends_on: [canvas]
  e2e:
    build:
      context: e2e
    profiles: [e2e]
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    environment:
      HUB_URL: http://hub:3180
      CANVAS_URL: http://canvas:3000
      DATA_DIR: /repo/docs/drawings
      BACKUPS_DIR: /backups
      REMOTE_DIR: /remote
      HOME: /tmp
    volumes:
      - "${HUB_TEST_REPO:?set by scripts/e2e.sh}:/repo:ro"
      - "${HUB_TEST_REMOTE:?set by scripts/e2e.sh}:/remote:ro"
      - "${HUB_TEST_BACKUPS:?set by scripts/e2e.sh}:/backups:ro"
      - "./test-results:/e2e/test-results"
    depends_on: [hub]
